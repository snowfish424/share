apiVersion: v1
kind: Namespace
metadata:
  name: corrdiff-poc
  labels:
    opendatahub.io/dashboard: "true"
    kueue.openshift.io/managed: "true"
    kueue-managed: "true"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: default
  namespace: corrdiff-poc
spec:
  clusterQueue: default
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: corrdiff-runner
  namespace: corrdiff-poc
