# Pipeline service account permissions for Iris E2E (train PVC mount + deploy InferenceService).
# Bind to the SA created when you configure the pipeline server (default name: pipeline).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: iris-pipeline-quickstart
  labels:
    app: rhoai-quickstart
    component: pipeline
rules:
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: iris-pipeline-quickstart
  labels:
    app: rhoai-quickstart
    component: pipeline
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: iris-pipeline-quickstart
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: rhoai-quickstart
