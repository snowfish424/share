apiVersion: v1
kind: ConfigMap
metadata:
  name: open-webui-config
  namespace: open-webui
  labels:
    app.kubernetes.io/name: open-webui
data:
  # =============================================================================
  # OFFLINE MODE - Master switch to disable all internet-dependent features
  # =============================================================================
  OFFLINE_MODE: "true"
  
  # =============================================================================
  # API Connections (server-side, bypasses CORS)
  # Configure via Admin UI: Settings > Connections > OpenAI API
  # =============================================================================
  ENABLE_OPENAI_API: "true"
  ENABLE_OLLAMA_API: "false"
  OLLAMA_BASE_URL: ""
  ENABLE_DIRECT_CONNECTIONS: "true"
  
  # Disable SSL verification for self-signed certificates (OpenShift routes)
  # Per official docs: https://docs.openwebui.com/getting-started/env-configuration/
  AIOHTTP_CLIENT_SESSION_SSL: "false"
  REQUESTS_VERIFY: "false"
  
  # =============================================================================
  # Disable features requiring external network
  # =============================================================================
  ENABLE_IMAGE_GENERATION: "false"    # Requires DALL-E/ComfyUI/etc.
  ENABLE_WEB_SEARCH: "false"          # Requires internet for search
  ENABLE_COMMUNITY_SHARING: "false"   # Requires openwebui.com
  
  # =============================================================================
  # Disable audio features (require model downloads)
  # Empty string = disabled, uses browser Web Speech API instead
  # =============================================================================
  AUDIO_STT_ENGINE: ""                # Disable backend STT (Whisper downloads)
  AUDIO_TTS_ENGINE: ""                # Disable backend TTS (model downloads)
  
  # =============================================================================
  # UI Features (local, no internet required)
  # =============================================================================
  ENABLE_MESSAGE_RATING: "true"
  ENABLE_SIGNUP: "true"
  ENABLE_MEMORIES: "false"
  
  # =============================================================================
  # Disable version update checks (requires internet)
  # OFFLINE_MODE also disables this, but explicit is better
  # =============================================================================
  ENABLE_VERSION_UPDATE_CHECK: "false"
  
  # =============================================================================
  # RAG Configuration - Disabled to prevent model downloads
  # =============================================================================
  BYPASS_EMBEDDING_AND_RETRIEVAL: "true"
  RAG_EMBEDDING_ENGINE: ""
  RAG_TOP_K: "3"
  CHUNK_SIZE: "1000"
  
  # Disable automatic model updates (requires internet)
  RAG_EMBEDDING_MODEL_AUTO_UPDATE: "false"
  RAG_RERANKING_MODEL_AUTO_UPDATE: "false"
  WHISPER_MODEL_AUTO_UPDATE: "false"
  
  # =============================================================================
  # HuggingFace/Transformers - Prevent model downloads
  # =============================================================================
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  
  # =============================================================================
  # WebUI Settings
  # =============================================================================
  WEBUI_NAME: "RHOAI Chat"
  WEBUI_AUTH: "true"
  ENABLE_WEBSOCKET_SUPPORT: "true"
  STATIC_DIR: "/app/backend/data/static"
  GLOBAL_LOG_LEVEL: "INFO"
