# 1. 在 http { ... } 區塊內（server 區塊外面），新增連線池設定
upstream python_backend {
    server 127.0.0.1:8999;
    keepalive 32; # 保持 32 條與 Python 的長連線，絕不排隊
}

server {
    listen 8080;
    server_name localhost;

    location /was-metrics {
        # 2. 改指向剛剛設定的連線池
        proxy_pass http://python_backend/metrics$is_args$args;
        
        # 3. 強制開啟 HTTP/1.1 與 清空 Connection 標頭，這是啟用 Nginx 併發連線池的必須設定
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
    }
}
